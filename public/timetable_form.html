<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Timetable Entry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f4f8;
        }

        h2 {
            margin-top: 30px;
        }

        label {
            font-weight: bold;
            margin-right: 10px;
        }

        input[type="text"],
        select {
            margin-bottom: 10px;
            padding: 6px;
            width: 200px;
        }

        .student-entry {
            margin-bottom: 10px;
        }

        .student-entry input {
            margin-right: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: #fff;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #e6e6e6;
        }

        .button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #3367d6;
        }
    </style>
</head>

<body>

    <h2>Enter Student Names</h2>
    <form action="/submit-timetable" method="POST">
        <div id="student-list">
            <div class="student-entry">
                <input type="text" name="student_name[]" placeholder="Enter Student Name">
            </div>
        </div>
        <button type="button" onclick="addStudent()">Add More</button>

        <h2>Enter Class Details</h2>
        <label>Class Name:</label>
        <input type="text" name="class_name"><br>
        <label>Year:</label>
        <input type="text" name="year"><br>
        <label>Course:</label>
        <input type="text" name="course"><br>

        <h2>Enter Timetable</h2>
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Day 1</th>
                    <th>Day 2</th>
                    <th>Day 3</th>
                    <th>Day 4</th>
                    <th>Day 5</th>
                </tr>
            </thead>
            <tbody>
                <!-- Time slots -->
                <script>
                    const times = [
                        "8:00 - 8:50",
                        "8:50 - 9:40",
                        "9:45 - 10:35",
                        "10:40 - 11:30",
                        "11:35 - 12:25",
                        "12:30 - 1:20",
                        "1:25 - 2:15",
                        "2:20 - 3:10",
                        "3:10 - 4:00",
                        "4:00 - 4:50"
                    ];

                    for (let i = 0; i < times.length; i++) {
                        document.write('<tr>');
                        document.write('<td>' + times[i] + '</td>');
                        for (let j = 1; j <= 5; j++) {
                            document.write('<td><input type="text" name="subject_' + i + '_' + j + '" placeholder="Subject"></td>');
                        }
                        document.write('</tr>');
                    }
                </script>
            </tbody>
        </table>

        <button type="submit" class="button">Upload</button>
    </form>

    <script>
        function addStudent() {
            const container = document.getElementById('student-list');
            const entry = document.createElement('div');
            entry.className = 'student-entry';
            entry.innerHTML = '<input type="text" name="student_name[]" placeholder="Enter Student Name">';
            container.appendChild(entry);
        }
    </script>

</body>

</html>
