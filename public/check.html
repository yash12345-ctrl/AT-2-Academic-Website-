<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hackathon Submission Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hackathon Submission</h2>
    <form action="/submit-hackathon" method="POST">
      <label for="hackathonName">Hackathon Name:</label>
      <input type="text" id="hackathonName" name="hackathonName" required />

      <label for="collegeName">College Name:</label>
      <input type="text" id="collegeName" name="collegeName" required />

      <label for="mode">Mode:</label>
      <select id="mode" name="mode" required>
        <option value="">Select</option>
        <option value="Online">Online</option>
        <option value="Offline">Offline</option>
      </select>

      <label for="deadline">Deadline Date:</label>
      <input type="date" id="deadline" name="deadline" required />

      <label for="fees">Registration Fees (₹):</label>
      <input type="number" id="fees" name="fees" required />

      <label for="link">Registration Link:</label>
      <input type="url" id="link" name="link" required />

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
