<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Internship Submission</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, #ff5ec4, #a362f9, #7f9df5, #70e7f2);
      background-size: cover;
      background-attachment: fixed;
      color: white;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #fff;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #fff;
    }

    input[type="text"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      background: #fdfdfd;
      color: #333;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #218838;
    }

    .success-message {
      color: #c6ffb1;
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Submit Internship Details</h2>
    <form id="internshipForm">
      <label for="companyName">Company Name</label>
      <input type="text" id="companyName" name="companyName" required>

      <label for="experience">Experience</label>
      <select id="experience" name="experience" required>
        <option value="">Select</option>
        <option value="experience">Experience</option>
        <option value="no_experience">No Experience</option>
      </select>

      <label for="title">Title</label>
      <input type="text" id="title" name="title" required>

      <label for="mode">Mode</label>
      <select id="mode" name="mode" required>
        <option value="">Select</option>
        <option value="online">Online</option>
        <option value="offline">Offline</option>
      </select>

      <label for="location">Location</label>
      <input type="text" id="location" name="location" required>

      <label for="about">About Company</label>
      <textarea id="about" name="about" required></textarea>

      <label for="link">Internship/Application Link</label>
      <input type="url" id="link" name="link" placeholder="https://example.com/apply" required>

      <button type="submit">Submit</button>
    </form>

    <div id="successMsg" class="success-message" style="display: none;">
      ✅ Data uploaded successfully!
    </div>
  </div>

  <script>
    document.getElementById("internshipForm").addEventListener("submit", function (e) {
      e.preventDefault(); // Prevent form reload

      const form = e.target;
      const formData = new FormData(form);

      fetch("/submit-internship", {
        method: "POST",
        body: new URLSearchParams(formData)
      })
      .then(response => {
        if (response.ok) {
          document.getElementById("successMsg").style.display = "block";
          form.reset();
        } else {
          alert("❌ Failed to submit data.");
        }
      })
      .catch(error => {
        console.error("Error:", error);
        alert("❌ An error occurred.");
      });
    });
  </script>
</body>
</html>
