<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hackathon Submission Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .success-message {
      margin-top: 15px;
      text-align: center;
      color: green;
      font-weight: bold;
    }

    .error-message {
      margin-top: 15px;
      text-align: center;
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hackathon Submission</h2>

    <form id="hackathonForm">
      <label for="hackathonName">Hackathon Name:</label>
      <input type="text" id="hackathonName" name="hackathonName" required />

      <label for="collegeName">College Name:</label>
      <input type="text" id="collegeName" name="collegeName" required />

      <label for="mode">Mode:</label>
      <select id="mode" name="mode" required>
        <option value="">Select</option>
        <option value="Online">Online</option>
        <option value="Offline">Offline</option>
      </select>

      <label for="deadline">Deadline Date:</label>
      <input type="date" id="deadline" name="deadline" required />

      <label for="fees">Registration Fees (₹):</label>
      <input type="number" id="fees" name="fees" required />

      <label for="link">Registration Link:</label>
      <input type="url" id="link" name="link" required />

      <label for="details">About / Description:</label>
      <textarea id="details" name="details" rows="4" required></textarea>

      <button type="submit">Submit</button>
    </form>

    <div id="responseMessage" class="success-message" style="display: none;"></div>
  </div>

  <script>
    document.getElementById('hackathonForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = {
        hackathonName: document.getElementById('hackathonName').value,
        collegeName: document.getElementById('collegeName').value,
        mode: document.getElementById('mode').value,
        deadline: document.getElementById('deadline').value,
        fees: document.getElementById('fees').value,
        link: document.getElementById('link').value,
        details: document.getElementById('details').value
      };

      const messageDiv = document.getElementById('responseMessage');

      try {
        const response = await fetch('/submit-hackathon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.success) {
          messageDiv.textContent = '✅ Hackathon submitted successfully!';
          messageDiv.style.color = 'green';
          messageDiv.style.display = 'block';
          document.getElementById('hackathonForm').reset();
        } else {
          messageDiv.textContent = '❌ Submission failed.';
          messageDiv.style.color = 'red';
          messageDiv.style.display = 'block';
        }

      } catch (error) {
        messageDiv.textContent = '⚠️ Server error occurred.';
        messageDiv.style.color = 'red';
        messageDiv.style.display = 'block';
        console.error('Submission Error:', error);
      }
    });
  </script>
</body>
</html>
